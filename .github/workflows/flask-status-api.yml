name: Flask to Go example
on:
  pull_request:
    paths: ['flask/status-api/**', 'scripts/candidate.py', 'scripts/check_catalog.py', '.github/workflows/flask-status-api.yml']
  push:
    branches: [main]
    paths: ['flask/status-api/**', 'scripts/candidate.py', 'scripts/check_catalog.py', '.github/workflows/flask-status-api.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.21'
      - run: uv venv --python 3.12 flask/status-api/.venv
      - run: uv pip install --python flask/status-api/.venv/bin/python -r flask/status-api/source/requirements.txt
      - run: flask/status-api/.venv/bin/python flask/status-api/scripts/check_source.py
  migration:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.21'
      # The pinned converter provisions checksum-verified Go 1.26.5 if absent.
      - run: uv run --no-project --python 3.12 python flask/status-api/scripts/accept_migration.py
      - run: python3 scripts/check_catalog.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: flask-go-acceptance
          path: flask/status-api/.sanka/acceptance.json
          include-hidden-files: true
          retention-days: 10
